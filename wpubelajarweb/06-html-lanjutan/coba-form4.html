<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form di Dalam Tabel</title>
</head>
<body>
    <h1>Coba Elemen-elemen form pada HTML</h1>

    <form>
        <table cellpadding="3">
            <tr>
                <td align="right">
                    <label for="nama">Nama: </label>
                </td>
                <td>
                    <input type="text" name="nama" id="nama" placeholder="Masukkan Nama">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="password">Password</label>
                </td>
                <td>
                     <input type="password" name="password" id="password">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="email">Email</label>
                </td>
                <td>
                     <input type="email" name="email" id="email">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="angka">Angka</label>
                </td>
                <td>
                    <input type="number" name="number" id="angka" min="0" max="1000" step="3">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="tanggal">Tanggal</label>
                </td>
                <td>
                     <input type="date" name="tanggal" id="tanggal">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="warna">Warna</label>
                </td>
                <td>
                    <input type="color" name="warna" id="warna">
                </td>
            </tr>
            <tr>
                <td align="right">
                     <label for="link">Link</label>
                </td>
                <td>
                    <input type="url" name="link" id="link">
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="tel">Telpon</label>
                </td>
                <td>
                    <input type="tel" name="tel" id="tel">
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="file">Berkas</label>
                </td>
                <td>
                    <input type="file" name="file" id="file">
                </td>
            </tr>
            <tr>
             <td>
                    <button type="submit">Kirim!</button>
            </td>
            </tr>
        </table>
    </form>
</body>
</html>
