<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Coba Elemen-elemen form pada HTML</h1>

    <form>
        <label for="nama">Nama: </label>
        <input type="text" name="nama" id="nama" placeholder="Masukkan Nama">
        <br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password">
        <br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email">
        <br>

        <label for="angka">Angka</label>
        <input type="number" name="number" id="angka" min="0" max="1000" step="3">
        <br>

        <label for="tanggal">Tanggal</label>
        <input type="date" name="tanggal" id="tanggal">
        <br>

        <label for="warna">Warna</label>
        <input type="color" name="warna" id="warna">
        <br>

        <label for="link">Link</label>
        <input type="url" name="link" id="link">
        <br>

        <label for="tel">Telpon</label>
        <input type="tel" name="tel" id="tel">
        <br>

        <label for="file">Berkas</label>
        <input type="file" name="file" id="files">
        <br>

        <button type="submit">Kirim!</button>
    </form>
</body>
</html>
