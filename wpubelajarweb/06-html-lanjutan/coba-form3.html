<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select dan Textarea</title>
</head>
<body>
    <form>
    <h3>Pilih Kota: </h3>
    <select name="kota" id="kota">
    <option value="">--Pilih Salah Satu--</option>
    <option value="bdg">Bandung</option>
    <option value="jkt">Jakarta</option>
    <option value="plg">Palembang</option>
    <option value="mdn">Medan</option>
    <option value="sby">Surabaya</option>
    <option value="lpg">Lampung</option>
    <option value="bgr">Bogor</option>
    <option value="krw">Karawang</option>
    </select>
    <br>

    <h3>About Me</h3>
    <textarea name="about" id="about" cols="60" rows="10" placeholder="isi data diri anda">Life's Journey is still long....</textarea>
    <br>
     
    <button type="submit">Kirim!</button>
    </form>
</body>
</html>
