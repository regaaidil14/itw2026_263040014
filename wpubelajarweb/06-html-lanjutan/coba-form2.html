<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, Checkbox, dan Radio</title>
</head>
<body>
    <h1>Contoh Input Atribut, Checkbox, dan Radio</h1>
    <form>
        <label for="name">Nama: </label>
        <input type="text" name="nama" id="name" placeholder="Masukkan Nama" autocomplete="off" autofocus required>
        <br>

        <button subbmit>Kirim!</button>

        <h2>Coba Checkbox</h2>
    
        <input type="checkbox" id="checkbox1" name="hobi1" value="Membaca" checked>
        <label for="checkbox1">Membaca</label>
        <br>

        <input type="checkbox" id="checkbox2" name="hobi2" value="Berenang">
        <label for="checkbox2">Berenang</label>
        <br>

        <input type="checkbox" id="checkbox3" name="hobi3" value="Membaca">
        <label for="checkbox2">Membaca</label>
        <br>

        <h2>Coba radio</h2>
        <input type="radio" id="radio1" name="jenis_kelamin" value="Laki-Laki" checked>
        <label for="radio1">Laki-Laki</label>
        <br>

        <input type="radio" id="radio2" name="jenis_kelamin" value="Perempuan">
        <label for="radio2">Perempuan</label>
    </form>
</body>
</html>
