<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
</head>
<style>
    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(239, 25, 25);
    }

    .frame {
        width: 400px;
        height: 400px;
        border: 10px solid white;
        margin: auto;
        background-image: url(img/doraemon.png), url(img/pokemon.png), url(img/backg.png);
        background-size: 320px, 400px, 500px;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-position: center bottom, center 70%, center;
        background-color: rgb(17, 195, 226);
        border-radius: 50%;
    }

    h1 {
        color: white;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        font-size: 40px;
        text-shadow: 2px 2px 4px black;
    }
</style>
<body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
</body>
</html>
