<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 4 sQuotes</title>
    <style>
        @font-face {
            font-family:sacramento;
            src: url(font-lexendzetta/LexendZetta-Bold.ttf) format(truetype);
        }
        
        body {
            background-color: #0F172A;
            background-image: linear-gradient(to bottom, rgb(15 23 42 / 60%) 20%,  rgb(15 23 42 / 30%)), url(https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;

        }

        h1 {
            font-family: sacramento, sans-serif;
            text-transform: uppercase;
            font-size: 4em;
            font-weight: bold;
            text-align: center;
            font-style: italic;
            text-decoration: none;
            /* text-shadow: 5px 5px 3px rgba(156, 156, 236, 0.3); */
            background-image: linear-gradient(to right, rgb(51, 51, 236), rgb(243, 86, 243));
            background-clip: text;
            letter-spacing: 5px;
            word-spacing: 3px;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(7 217 236 / 70%));

        }

        .quote {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
            word-spacing: 5px;
            text-align: center;
            color: aliceblue;
            background-color: rgba(255 255 255 / 5%);
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255 255 255 / 10%);
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }

        span {
            color: rgb(221, 16, 253);
            font-style: italic;
            text-decoration: none;
            text-shadow: 0 0 20px rgb(140, 255, 0);
        }

        .cc {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: rgb(14 192 237 / 50%);
            font-weight: normal;
            text-align: center;
            text-transform: uppercase;
            border-top: 1px solid rgba(255 255 255 / 20%);
            width: 30%;
            margin: 30px auto;
            padding-top: 20px;
        }

    </style>

</head>
<body>
    <h1>teruslah berkelana</h1>
    <p class="quote">Teruslah berjalan karena manusia diciptakan untuk terus <span>berkelana</span>. Bukan agar menemukan dunia, melainkan agar menemukan dirinya sendiri diantara luasnya semesta</p>

    <p class="cc">-quotes abal abal-</p>
</body>
</html>
