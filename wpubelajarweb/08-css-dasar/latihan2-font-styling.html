<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 Quotes</title>
    <style>
        @font-face {
            font-family:sacramento;
            src: url(font-lexendzetta/LexendZetta-Bold.ttf) format(truetype);
        }

        h1 {
            font-family: sacramento, sans-serif;
            text-transform: uppercase;
            font-size: 40 px;
            font-weight: bold;
            text-align: center;
            font-style: italic;
            color: cornflowerblue;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: cyan;
            text-shadow: 5px 5px 3px rgb(177, 177, 245);
            text-decoration-skip-ink: none;
            letter-spacing: 5px;
            word-spacing: 3px;

        }

        .quote {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
            word-spacing: 5px;
            text-align: center;
            color: darkblue;
        }

        span {
            color: darkorchid;
            font-style: italic;
            text-decoration: underline;
        }

        .cc {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: brown;
            font-weight: normal;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>teruslah berkelana</h1>
    <p class="quote">Teruslah berjalan karena manusia diciptakan untuk terus <span>berkelana</span>. Bukan agar menemukan dunia, melainkan agar menemukan dirinya sendiri diantara luasnya semesta</p>

    <p class="cc">-quotes abal abal-</p>
</body>
</html>
